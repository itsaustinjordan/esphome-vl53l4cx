# Copy these lines into your ESPHome secrets file
# (ESPHome dashboard -> three-dot menu, top right -> Secrets)
# and replace every value with your own.

wifi_ssid: "YourNetworkName"
wifi_password: "YourWifiPassword"

# One key shared by all your ToF devices. Generate your own with:
#   openssl rand -base64 32
# Home Assistant asks for this key once per device when you add it.
tof_api_key: "REPLACE-ME-WITH-A-GENERATED-KEY"

# Only used by the emergency fallback hotspot if WiFi is unreachable.
fallback_ap_password: "ChangeMe123"
